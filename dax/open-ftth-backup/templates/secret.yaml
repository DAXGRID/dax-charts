{{- range $i, $backup := .Values.appsettings.settings.postgresBackups }}
{{- $_ := required (printf "appsettings.settings.postgresBackups[%d].connection.password is required" $i) $backup.connection.password }}
{{- end }}
{{- $_ := required "appsettings.settings.fileServer.password is required" .Values.appsettings.settings.fileServer.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-secret
data:
  appsettings: |-
{{ .Values.appsettings | toJson | b64enc | indent 4 }}
