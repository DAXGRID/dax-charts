databaseName: postgres
username: postgres
password: ""

serviceType: ClusterIP

image:
  repository: postgres
  tag: 18.6-trixie

volumeClaim:
  storageClassName: ""
  storage: 10Gi

# Keep sharedBuffers and effectiveCacheSize in line with this when changing it.
resources:
  requests:
    memory: 2Gi

serviceAnnotations: {}

maxConnections: 100
# ~25% of the memory request, requires a restart to change.
sharedBuffers: "512MB"
# ~75% of the memory request, only a planner hint for how much data is likely
# cached by postgres and the OS, does not allocate memory.
effectiveCacheSize: "1536MB"
# 200 assumes SSD storage, which handles many concurrent reads, use 2 for
# spinning disks.
effectiveIoConcurrency: 200
seqPageCost: 1.0
# 1.1 assumes SSD storage, use 4.0 for spinning disks.
# Not 1.0 because sequential reads are still slightly cheaper on SSD (OS
# read-ahead), and it makes the planner prefer seq scans on equal cost.
randomPageCost: 1.1
cpuTupleCost: 0.01
# Higher values mean fewer checkpoints during bulk imports, but WAL can use up
# to this much disk, so keep it well below volumeClaim.storage.
maxWalSize: "2GB"

sslEnabled: false
rootCertificate: ""
serverCertificate: ""
serverKey: ""
