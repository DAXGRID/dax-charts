image:
  repository: daxgrid/address-change-indexer
  tag: v0.6.14

resources:
  memoryRequest: 2.75Gi
  memoryLimit: 3.0Gi

appsettings:
  settings:
    eventStoreConnectionString: ""
    geoDatabaseConnectionString: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1654
  runAsGroup: 1654
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
