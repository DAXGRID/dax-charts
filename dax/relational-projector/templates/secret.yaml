apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-secret
data:
  geoDatabasePassword: {{ required "geoDatabase.password is required" .Values.geoDatabase.password | b64enc }}
  eventStoreDatabasePassword: {{ required "eventStoreDatabase.password is required" .Values.eventStoreDatabase.password | b64enc }}
