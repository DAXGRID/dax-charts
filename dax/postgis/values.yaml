username: postgres
password: ""

serviceType: ClusterIP

image:
  repository: daxgrid/postgis
  tag: 18.6-3.6.4

volumeClaim:
  storageClassName: ""
  storage: 10Gi

resources:
  requests:
    memory: 1Gi

serviceAnnotations: {}

maxConnections: 100
sharedBuffers: "128MB"
effectiveCacheSize: "4096MB"
effectiveIoConcurrency: 10
seqPageCost: 1.0
# 1.1 assumes SSD storage, use 4.0 for spinning disks.
# Not 1.0 because sequential reads are still slightly cheaper on SSD (OS
# read-ahead), and it makes the planner prefer seq scans on equal cost.
randomPageCost: 1.1
cpuTupleCost: 0.01
maxWalSize: "1028MB"
walLevel: "replica"
maxWalSenders: 10

sslEnabled: false
rootCertificate: ""
serverCertificate: ""
serverKey: ""
postgresDatabaseName: "OPEN_FTTH"

