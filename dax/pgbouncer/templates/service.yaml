apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
  annotations: {{ toYaml .Values.serviceAnnotations | nindent 4 }}
spec:
  type: {{ .Values.serviceType }}
  ports:
    - port: 5432
      targetPort: 6432
  {{- if ne .Values.serviceType "ClusterIP" }}
  externalTrafficPolicy: Local
  {{- end }}
  selector:
    app: {{ .Release.Name }}
