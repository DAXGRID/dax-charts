{{- if .Values.config.ssl.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-tls-secret
type: Opaque
data:
  root.crt: {{ .Values.config.ssl.root | b64enc }}
  server.crt: {{ .Values.config.ssl.cert | b64enc }}
  server.key: {{ .Values.config.ssl.key | b64enc }}
{{- end }}
