replicas: 1

# LoadBalancer gives QGIS clients a stable address on port 5432.
# Use ClusterIP if pgbouncer should only be reachable inside the cluster.
serviceType: LoadBalancer
serviceAnnotations: {}

image:
  repository: daxgrid/pgbouncer
  tag: 1.25.2-r0

resources:
  memoryRequest: 100Mi
  memoryLimit: 150Mi

config:
  adminUsers: postgres
  listenAddress: "*"
  authType: md5
  # Session mode is required by QGIS (cursors, SET, LISTEN, edit transactions).
  poolMode: session
  # In session mode each client holds a server connection, so the pool size
  # caps concurrent clients. Keep defaultPoolSize + reservePoolSize below
  # postgres max_connections, with room for other services.
  defaultPoolSize: 60
  reservePoolSize: 5
  maxClientConn: 200
  # Detects dead client connections (e.g. dropped by NAT or firewalls), so they
  # free their pool slot after ~2 minutes instead of the OS default of ~2 hours.
  tcpKeepalive:
    idle: 60
    interval: 10
    count: 6
  # Appends the client IP and port to application_name, so pg_stat_activity
  # shows which client owns each connection instead of only the pgbouncer IP.
  applicationNameAddHost: true
  databases:
    - host: postgres
      name: postgres
      port: 5432
  ssl:
    enabled: false
    sslMode: "require"
    key: ""
    cert: ""
    root: ""

userlist:
  - name: postgres
    password: ""

# Example HBA.
# hba:
#   - type: host
#     database: all
#     user: all
#     address: 0.0.0.0/0
#     method: md5
