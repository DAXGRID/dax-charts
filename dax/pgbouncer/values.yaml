replicas: 1

serviceType: NodePort
serviceAnnotations: {}

image:
  repository: daxgrid/pgbouncer
  tag: 1.25.2-r0

resources:
  memoryRequest: 100Mi
  memoryLimit: 150Mi

config:
  adminUsers: postgres
  listenAddress: "*"
  authType: md5
  # Session mode is required by QGIS (cursors, SET, LISTEN, edit transactions).
  poolMode: session
  # In session mode each client holds a server connection, so the pool size
  # caps concurrent clients. Keep defaultPoolSize + reservePoolSize below
  # postgres max_connections, with room for other services.
  defaultPoolSize: 60
  reservePoolSize: 5
  maxClientConn: 200
  databases:
    - host: postgres
      name: postgres
      port: 5432
  ssl:
    enabled: false
    sslMode: "require"
    key: ""
    cert: ""
    root: ""

userlist:
  - name: postgres
    password: ""

# Example HBA.
# hba:
#   - type: host
#     database: all
#     user: all
#     address: 0.0.0.0/0
#     method: md5
