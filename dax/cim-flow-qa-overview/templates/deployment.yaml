apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        # To restart if there are changes to the settings or maplibre config.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/cm.yaml") . | sha256sum }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          imagePullPolicy: Always
          volumeMounts:
            - name: {{ .Release.Name }}-secret-volume
              mountPath: /app/settings.json
              subPath: settings.json
            {{- if .Values.maplibreJson }}
            - name: {{ .Release.Name }}-mnt
              mountPath: /app/web/maplibre.json
              subPath: maplibre.json
            {{- end }}
          resources:
            requests:
              memory: {{ .Values.resources.memoryRequest }}
            limits:
              memory: {{ .Values.resources.memoryLimit }}
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /metrics/health
              port: 8080
            initialDelaySeconds: 10
            timeoutSeconds: 15
            failureThreshold: 100
          readinessProbe:
            httpGet:
              path: /metrics/health
              port: 8080
            initialDelaySeconds: 10
            timeoutSeconds: 15
            periodSeconds: 50
      volumes:
        - name: {{ .Release.Name }}-secret-volume
          secret:
            secretName: {{ .Release.Name }}-secret
            items:
            - key: settings.json
              path: settings.json
        {{- if .Values.maplibreJson }}
        - name: {{ .Release.Name }}-mnt
          configMap:
            name: {{ .Release.Name }}
            items:
            - key: maplibre.json
              path: maplibre.json
        {{- end }}
      imagePullSecrets:
        - name: {{ .Values.imgPullSecret }}
      restartPolicy: Always
